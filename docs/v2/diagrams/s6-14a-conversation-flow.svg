<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="900" viewBox="0 0 1460 900" role="img" aria-labelledby="title desc"><title id="title">Easel 对话式创作：前后端交互设计</title><desc id="desc">用户在现有 Easel 对话中讨论、确认和审片。新增作品会话适配调用现有 WorkService，业务快照与事件返回界面。原 MiniMax、素材、配音、剪辑、渲染生产链继续运行。设计提案，尚未实施。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#52677b"/></marker></defs><rect width="1460" height="900" fill="#f4f7fb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172d43}.title{font-size:33px;font-weight:600}.sub{font-size:18px;fill:#52677b}.h{font-size:24px;font-weight:600}.body{font-size:19px}.tag{font-size:16px;font-weight:600}.line{stroke:#52677b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
