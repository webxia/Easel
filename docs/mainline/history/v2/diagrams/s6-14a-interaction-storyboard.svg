<text x="1160" y="303" class="body">素材已就绪，正在配音。</text>
<text x="1160" y="333" class="body">已完成成果可展开查看。</text>
<text x="1145" y="414" class="body">可继续问：“为什么选择这组画面？”</text>
<text x="1145" y="456" class="body">关闭页面后制作仍继续</text>
<rect x="1145" y="500" width="128" height="40" rx="10" fill="#225ec7" stroke="#225ec7"/>
<text x="1160" y="526" class="button">查看步骤</text>
<text x="1300" y="527" class="small">取消制作是独立动作</text>
<rect x="40" y="636" width="500" height="448" rx="18" fill="#fff" stroke="#d4dfe8"/>
<rect x="58" y="654" width="464" height="40" rx="10" fill="#eaf0fb" stroke="#eaf0fb"/>
<text x="73" y="681" class="head">04  有具体缺口时集中决定</text>
<text x="65" y="724" class="small">作品：第一次做产品的经历   ·   导演：已选风格</text>
<text x="65" y="1056" class="small">后端：真实决定项 → 原 grant / resume 等命令</text>
<rect x="65" y="740" width="450" height="124" rx="12" fill="#fff4e1" stroke="#fff4e1"/>
<text x="80" y="766" class="tag">需要你决定 · 示例</text>
<text x="80" y="797" class="body">本步骤缺少所需媒体服务授权。</text>
<text x="80" y="827" class="body">尚未发送调用，已有配音会保留。</text>
<text x="65" y="905" class="body">卡片说明用途、服务和已保留的成果</text>
<text x="65" y="944" class="body">已有有效授权时不重复询问</text>
<rect x="65" y="992" width="166" height="40" rx="10" fill="#225ec7" stroke="#225ec7"/>
<text x="80" y="1018" class="button">授权此服务并继续</text>
<rect x="580" y="636" width="500" height="448" rx="18" fill="#fff" stroke="#d4dfe8"/>
<rect x="598" y="654" width="464" height="40" rx="10" fill="#eaf0fb" stroke="#eaf0fb"/>
<text x="613" y="681" class="head">05  在对话内审片和局部修改</text>
<text x="605" y="724" class="small">作品：第一次做产品的经历   ·   导演：已选风格</text>
<text x="605" y="1056" class="small">后端：绑定此 Output；影响分析与成果复用</text>
<rect x="605" y="740" width="450" height="145" rx="12" fill="#1c314a" stroke="#1c314a"/>
<text x="773" y="805" class="head" style="fill:#fff">▶  成片 · 第 1 版</text>
<text x="638" y="853" class="small" style="fill:#dae5ef">技术检查通过 · 语义未测 · 待人工审核</text>
<text x="605" y="923" class="body">你：“12 秒这处换画面，声音保持。”</text>
<text x="605" y="958" class="small">反馈绑定正在看的版本与时间点</text>
<rect x="605" y="992" width="166" height="40" rx="10" fill="#225ec7" stroke="#225ec7"/>
<text x="620" y="1018" class="button">明确接受此版本</text>
<text x="790" y="1019" class="small">或继续提出修改</text>
<rect x="1120" y="636" width="500" height="448" rx="18" fill="#fff" stroke="#d4dfe8"/>
<rect x="1138" y="654" width="464" height="40" rx="10" fill="#eaf0fb" stroke="#eaf0fb"/>
<text x="1153" y="681" class="head">06  找回作品，继续同一创作</text>
<text x="1145" y="724" class="small">作品：第一次做产品的经历   ·   导演：已选风格</text>
<text x="1145" y="1056" class="small">后端：恢复快照与依据；新附件重新校验归属</text>
<rect x="1145" y="740" width="450" height="124" rx="12" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="1160" y="766" class="tag">从作品列表 / 内容库打开</text>
<text x="1160" y="797" class="body">恢复方案、进度、版本与审核状态。</text>
<text x="1160" y="827" class="body">可在新对话继续，不重跑已有制作。</text>
<text x="1145" y="907" class="body">新对话上传素材 → 校验关联 → 登记</text>
<text x="1145" y="946" class="small">保留旧成片和原始来源，不覆盖回执</text>
<rect x="1145" y="992" width="128" height="40" rx="10" fill="#225ec7" stroke="#225ec7"/>
<text x="1160" y="1018" class="button">继续讨论</text>
<text x="1290" y="1019" class="small">恢复必要依据和业务卡</text>
<text x="40" y="1141" class="sub">普通聊天转入视频：明确进入作品模式 → 服务端开启受限运行段；UI 保持同一助手，旧聊天历史保留。</text>
<text x="40" y="1174" class="small">作品详情可展开脚本、素材与版本；明确卡操作提交授权和接受。A1隔离通过，完整Web旅程待A2～A5验证。</text>
