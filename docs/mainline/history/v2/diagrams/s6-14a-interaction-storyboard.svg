<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1190" viewBox="0 0 1660 1190" role="img" aria-labelledby="title"><title id="title">Easel 对话式视频创作六步交互分镜</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#54718b"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#27836a"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#19344a}.title{font-size:34px;font-weight:650}.sub{font-size:19px;fill:#60798e}.head{font-size:25px;font-weight:600}.body{font-size:20px}.small{font-size:17px;fill:#60798e}.tag{font-size:17px;font-weight:600}.button{font-size:18px;font-weight:600;fill:#fff}</style><rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="40" y="60" class="title">Easel · 六步对话交互分镜</text>
<text x="40" y="102" class="sub">界面内容示意，非真实制作回执 · S6-14A 目标方案 · 2026-10-18 · 尚未实施</text>
<rect x="40" y="142" width="500" height="448" rx="18" fill="#fff" stroke="#d4dfe8"/>
<rect x="58" y="160" width="464" height="40" rx="10" fill="#eaf0fb" stroke="#eaf0fb"/>
<text x="73" y="187" class="head">01  直接说想法，继续讨论</text>
<text x="65" y="230" class="small">作品：第一次做产品的经历   ·   导演：已选风格</text>
<text x="65" y="562" class="small">后端：草稿与本片上下文；不启动完整规划</text>
<rect x="65" y="246" width="450" height="94" rx="12" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="80" y="272" class="tag">你</text>
<text x="80" y="303" class="body">别太励志，保留我失败的部分。</text>
<rect x="65" y="356" width="450" height="124" rx="12" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="80" y="382" class="tag">Easel</text>
<text x="80" y="413" class="body">从一个具体失误切入，</text>
<text x="80" y="443" class="body">用后来的行动收尾。你想保留哪件事？</text>
<rect x="65" y="500" width="164" height="40" rx="10" fill="#225ec7" stroke="#225ec7"/>
<text x="80" y="526" class="button">整理完整方案</text>
<text x="248" y="527" class="small">也可继续输入讨论</text>
<rect x="580" y="142" width="500" height="448" rx="18" fill="#fff" stroke="#d4dfe8"/>
<rect x="598" y="160" width="464" height="40" rx="10" fill="#eaf0fb" stroke="#eaf0fb"/>
<text x="613" y="187" class="head">02  看完整方案，一次确认</text>
<text x="605" y="230" class="small">作品：第一次做产品的经历   ·   导演：已选风格</text>
<text x="605" y="562" class="small">后端：正式 Plan 版本 / hash / 制作授权</text>
<rect x="605" y="246" width="450" height="124" rx="12" fill="#f3f6fa" stroke="#f3f6fa"/>
<text x="620" y="272" class="tag">方案 · 第 2 版</text>
<text x="620" y="303" class="body">开场冲突 → 失败经历 → 克制收尾</text>
<text x="620" y="333" class="body">45 秒 · 竖屏 · 固定声音 · 中文字幕</text>
<text x="605" y="408" class="small">展开：脚本 / 场景 / 素材方向 / 服务与次数</text>
<text x="605" y="448" class="body">明确指定内容、许可和本次制作范围</text>
<rect x="605" y="500" width="192" height="40" rx="10" fill="#225ec7" stroke="#225ec7"/>
<text x="620" y="526" class="button">确认此方案并制作</text>
<text x="814" y="527" class="small">继续讨论修改</text>
<rect x="1120" y="142" width="500" height="448" rx="18" fill="#fff" stroke="#d4dfe8"/>
<rect x="1138" y="160" width="464" height="40" rx="10" fill="#eaf0fb" stroke="#eaf0fb"/>
