<text x="1145" y="230" class="small">作品：第一次做产品的经历   ·   导演：已选风格</text>
<text x="1145" y="562" class="small">后端：现有 Worker；作品 SSE 独立更新</text>
<rect x="1145" y="246" width="450" height="124" rx="12" fill="#f3f6fa" stroke="#f3f6fa"/>
